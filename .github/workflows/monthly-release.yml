name: Monthly release (Zenodo DOI)

on:
  schedule:
    - cron: "0 8 1 * *"   # 1st of each month, 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date -u +%Y.%m)"
          gh release view "$TAG" >/dev/null 2>&1 && { echo "$TAG exists"; exit 0; }
          gh release create "$TAG" --title "Builders in Fintech data $TAG" \
            --notes "Monthly snapshot of https://buildersinfintech.ai/data (CC BY 4.0)."
